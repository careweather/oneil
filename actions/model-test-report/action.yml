name: "Oneil model test report"
description: "Runs `oneil test` against Oneil models and, when comparing a PR head against its base, reports regressions and fixes."
author: "careweather"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  oneil-ref:
    description: >-
      Oneil release tag to install and test with (e.g. v1.0.0). Must match a
      published GitHub Release; installed via the sibling install-oneil Action.
    required: true
  github-token:
    description: >-
      Optional token for downloading release assets (raises API rate limits).
      Defaults to the job token.
    required: false
    default: ${{ github.token }}
  head-dir:
    description: "Directory containing the head checkout to test."
    required: false
    default: "."
  base-dir:
    description: "Directory containing the base checkout to test, for regression/fix comparison. Omit to just report the head checkout's own results."
    required: false
    default: ""
  model-dir:
    description: "Path (relative to each checkout's root) containing the .on / .one source files."
    required: false
    default: "model"
  models:
    description: "Comma-separated list of specific .on / .one filenames (relative to model-dir) to test. Overrides auto-discovery."
    required: false
    default: ""
  skip-models:
    description: "Comma-separated list of .on / .one filenames (relative to model-dir) to exclude from auto-discovery. Ignored if `models` is set."
    required: false
    default: ""
  timeout-seconds:
    description: "Per-model `oneil test` timeout, in seconds."
    required: false
    default: "120"
  report-path:
    description: "If set, also write the Markdown report to this file (relative to the workspace)."
    required: false
    default: ""
  fail-on-problems:
    description: "Fail the action when there are problems (regressions, new failures, new diagnostics, or -- with no base-dir -- any head failure). Set to \"false\" to only warn."
    required: false
    default: "true"
  head-label:
    description: "Label for the head checkout in the report (e.g. a PR head ref)."
    required: false
    default: "head"
  base-label:
    description: 'Label for the base checkout in the report (e.g. a PR base ref). Defaults to "base" when base-dir is set.'
    required: false
    default: ""

outputs:
  has-problems:
    description: '"true" if there are regressions, new failures, new diagnostics, or (with no base-dir) any head failure.'
    value: ${{ steps.report.outputs.has-problems }}
  report:
    description: "The rendered Markdown report, e.g. for posting as a PR comment."
    value: ${{ steps.report.outputs.report }}
  report-path:
    description: "Echoes the report-path input, for convenience in later steps (e.g. actions/upload-artifact)."
    value: ${{ steps.report.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Install Oneil CLI
      # Nested `uses:` cannot take dynamic refs in composite Actions, and
      # relative `../install-oneil` is resolved against the *caller* repo.
      # The whole oneil checkout is on disk next to this Action, so run the
      # shared install script from the sibling directory instead.
      shell: bash
      env:
        ONEIL_VERSION: ${{ inputs.oneil-ref }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../install-oneil/install.sh"

    - name: Run model test report
      id: report
      shell: bash
      env:
        # @actions/core getInput("oneil-ref") reads INPUT_ONEIL-REF (spaces→_, case↑).
        INPUT_ONEIL-REF: ${{ inputs.oneil-ref }}
        INPUT_HEAD-DIR: ${{ inputs.head-dir }}
        INPUT_BASE-DIR: ${{ inputs.base-dir }}
        INPUT_MODEL-DIR: ${{ inputs.model-dir }}
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_SKIP-MODELS: ${{ inputs.skip-models }}
        INPUT_TIMEOUT-SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_REPORT-PATH: ${{ inputs.report-path }}
        INPUT_FAIL-ON-PROBLEMS: ${{ inputs.fail-on-problems }}
        INPUT_HEAD-LABEL: ${{ inputs.head-label }}
        INPUT_BASE-LABEL: ${{ inputs.base-label }}
      run: node "${GITHUB_ACTION_PATH}/dist/index.cjs"
