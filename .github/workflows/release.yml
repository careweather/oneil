# Build and publish release artifacts when a version tag is pushed (e.g. `v1.0.0`).
#
# Artifacts: the Rust `oneil` compiler for Linux, Windows, and macOS (one archive
# per Python 3.12 layout), plus wheels for the Python library (`import oneil`).

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: BUILD (${{ matrix.triple }} / ${{ matrix.flavor }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            flavor: system
            archive: tar.gz
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            flavor: uv
            archive: tar.gz
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            flavor: system
            archive: zip
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            flavor: uv
            archive: zip
          - runner: macos-latest
            triple: aarch64-apple-darwin
            flavor: homebrew
            archive: tar.gz
          - runner: macos-latest
            triple: aarch64-apple-darwin
            flavor: uv
            archive: tar.gz
          - runner: macos-latest
            triple: aarch64-apple-darwin
            flavor: system
            archive: tar.gz
          # Intel macOS runners are scarce / often cancelled in queue; ship
          # Apple Silicon only for now. Re-add x86_64-apple-darwin when stable.
    env:
      ASSET_NAME: oneil-${{ github.ref_name }}-${{ matrix.triple }}-${{ matrix.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Each flavor links against that layout's CPython 3.12. Homebrew and
      # system bake a stable absolute path. uv's prefix is per-user and
      # patch-versioned, so that flavor is rewritten to a relocatable load
      # command after the build; the extension sets the library search path
      # when it spawns the binary.
      - name: Install Python 3.12 (Homebrew)
        if: matrix.flavor == 'homebrew'
        run: |
          brew install python@3.12
          echo "PYO3_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"

      - name: Install Python 3.12 (uv)
        if: matrix.flavor == 'uv'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Export PYO3_PYTHON (uv)
        if: matrix.flavor == 'uv'
        shell: bash
        run: echo "PYO3_PYTHON=$(uv python find 3.12)" >> "$GITHUB_ENV"

      - name: Install Python 3.12 (system, Linux)
        if: matrix.flavor == 'system' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12-dev
          echo "PYO3_PYTHON=python3.12" >> "$GITHUB_ENV"

      - name: Install Python 3.12 (system, Windows)
        if: matrix.flavor == 'system' && runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export PYO3_PYTHON (system, Windows)
        if: matrix.flavor == 'system' && runner.os == 'Windows'
        shell: bash
        run: echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install Python 3.12 (system, macOS)
        if: matrix.flavor == 'system' && runner.os == 'macOS'
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/python3.12.pkg" \
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg"
          sudo installer -pkg "${RUNNER_TEMP}/python3.12.pkg" -target /
          echo "PYO3_PYTHON=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.triple }}-${{ matrix.flavor }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p oneil

      - name: Make uv binary relocatable
        if: matrix.flavor == 'uv' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/oneil"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            old="$(otool -L "$bin" | awk '/libpython|Python\.framework/{print $1; exit}')"
            if [[ -z "$old" ]]; then
              echo "No libpython load command on $bin"
              otool -L "$bin"
              exit 1
            fi
            install_name_tool -change "$old" "@rpath/libpython3.12.dylib" "$bin"
            otool -L "$bin"
          else
            sudo apt-get update
            sudo apt-get install -y patchelf
            patchelf --remove-rpath "$bin"
            patchelf --print-needed "$bin"
          fi

      - name: Create archive (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p release
          cp target/release/oneil release/oneil
          chmod +x release/oneil
          tar -czvf "${ASSET_NAME}.tar.gz" -C release oneil

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/oneil.exe release/oneil.exe
          Compress-Archive -Path "release/oneil.exe" -DestinationPath "$env:ASSET_NAME.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}-${{ matrix.flavor }}
          path: ${{ env.ASSET_NAME }}.${{ matrix.archive }}

  build-python-wheels:
    name: Python library wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build wheels
        run: maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: dist/*.whl

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, build-python-wheels]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach install-oneil.sh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp actions/install-oneil/install.sh artifacts/install-oneil.sh
          python3 - <<'PY'
          import os
          import pathlib

          path = pathlib.Path("artifacts/install-oneil.sh")
          tag = os.environ["TAG"]
          text = path.read_text(encoding="utf-8")
          old = 'DEFAULT_ONEIL_VERSION=""'
          new = f'DEFAULT_ONEIL_VERSION="{tag}"'
          if old not in text:
              raise SystemExit("DEFAULT_ONEIL_VERSION placeholder missing from install.sh")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print(f"Stamped {path} with {tag}")
          PY

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"
          python3 - "$VERSION" "$OUT" <<'PY'
          import pathlib
          import sys

          version, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          start = text.find(header)
          if start < 0:
              changelog = f"Release {version}. See CHANGELOG.md for details.\n"
          else:
              rest = text[start + len(header) :]
              nl = rest.find("\n")
              body = rest[nl + 1 :] if nl >= 0 else rest
              end = body.find("\n## [")
              section = body if end < 0 else body[:end]
              changelog = section.strip() + "\n"

          notes = f"""{changelog}
          ## Binaries

          Each archive is linked against a specific Python 3.12 layout. The CLI does not ship Python. Download the flavor that matches how 3.12 is installed, or let the VS Code / Cursor extension pick it:

          - Linux: `oneil-v{version}-x86_64-unknown-linux-gnu-system.tar.gz`, `…-uv.tar.gz`
          - Windows: `oneil-v{version}-x86_64-pc-windows-msvc-system.zip`, `…-uv.zip`
          - Apple Silicon macOS: `oneil-v{version}-aarch64-apple-darwin-homebrew.tar.gz`, `…-system.tar.gz`, `…-uv.tar.gz`

          Or run the attached installer (detects the Python layout and downloads that archive):

          ```sh
          curl -fsSL https://github.com/careweather/oneil/releases/download/v{version}/install-oneil.sh | bash
          ```

          See the [installation guide](https://oneil-lang.org/02-installation.html).

          ## Python library

          Wheels for the Python library (`pip install` / `import oneil`) are
          attached. Appendix A covers `import oneil` from a standalone interpreter.
          """
          # Dedent the f-string block above (leading spaces from YAML heredoc style).
          import textwrap

          out_path.write_text(textwrap.dedent(notes).strip() + "\n", encoding="utf-8")
          print(f"Wrote release notes ({out_path.stat().st_size} bytes)")
          PY
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # `v1.0.0-beta.4` contains `-` after the core version; keep those off
          # `/releases/latest` so the extension and install-oneil do not treat
          # a beta as the stable latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
