# Build and publish release artifacts when a version tag is pushed (e.g. `v1.0.0`).
#
# Artifacts: the Rust `oneil` compiler for Linux, Windows, and macOS (one archive
# per Python 3.12 and 3.14), plus wheels for the Python library (`import oneil`).

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: BUILD (${{ matrix.triple }} / py${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            python: "3.12"
            archive: tar.gz
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            python: "3.14"
            archive: tar.gz
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            python: "3.12"
            archive: zip
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            python: "3.14"
            archive: zip
          - runner: macos-latest
            triple: aarch64-apple-darwin
            python: "3.12"
            archive: tar.gz
          - runner: macos-latest
            triple: aarch64-apple-darwin
            python: "3.14"
            archive: tar.gz
          # Intel macOS runners are scarce / often cancelled in queue; ship
          # Apple Silicon only for now. Re-add x86_64-apple-darwin when stable.
    env:
      ASSET_NAME: oneil-${{ github.ref_name }}-${{ matrix.triple }}-py${{ matrix.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Link against this minor version. The `oneil` loader finds whichever
      # install of that version is present (Homebrew, python.org, distro, uv)
      # and execs `oneil-runner` with PYTHONHOME set. macOS rewrites the load
      # command to `@executable_path/libpython3.x.dylib` so dyld does not need
      # DYLD_LIBRARY_PATH.
      - name: Install Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=$(uv python find ${{ matrix.python }})" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.triple }}-py${{ matrix.python }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p oneil -p oneil_loader

      - name: Make the runner relocatable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/oneil-runner"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            old="$(otool -L "$bin" | awk '/libpython|Python\.framework/{print $1; exit}')"
            if [[ -z "$old" ]]; then
              echo "No libpython load command on $bin"
              otool -L "$bin"
              exit 1
            fi
            install_name_tool -change "$old" "@executable_path/libpython${{ matrix.python }}.dylib" "$bin"
            otool -L "$bin"
          else
            sudo apt-get update
            sudo apt-get install -y patchelf
            patchelf --remove-rpath "$bin"
            patchelf --print-needed "$bin"
          fi

      - name: Create archive (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p release
          cp target/release/oneil target/release/oneil-runner release/
          chmod +x release/oneil release/oneil-runner
          tar -czvf "${ASSET_NAME}.tar.gz" -C release oneil oneil-runner

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/oneil.exe release/oneil.exe
          Copy-Item target/release/oneil-runner.exe release/oneil-runner.exe
          Compress-Archive -Path "release/oneil.exe","release/oneil-runner.exe" -DestinationPath "$env:ASSET_NAME.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}-py${{ matrix.python }}
          path: ${{ env.ASSET_NAME }}.${{ matrix.archive }}

  build-python-wheels:
    name: Python library wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build wheels
        run: maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: dist/*.whl

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, build-python-wheels]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach install-oneil.sh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp actions/install-oneil/install.sh artifacts/install-oneil.sh
          python3 - <<'PY'
          import os
          import pathlib

          path = pathlib.Path("artifacts/install-oneil.sh")
          tag = os.environ["TAG"]
          text = path.read_text(encoding="utf-8")
          old = 'DEFAULT_ONEIL_VERSION=""'
          new = f'DEFAULT_ONEIL_VERSION="{tag}"'
          if old not in text:
              raise SystemExit("DEFAULT_ONEIL_VERSION placeholder missing from install.sh")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print(f"Stamped {path} with {tag}")
          PY

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"
          python3 - "$VERSION" "$OUT" <<'PY'
          import pathlib
          import sys

          version, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          start = text.find(header)
          if start < 0:
              changelog = f"Release {version}. See CHANGELOG.md for details.\n"
          else:
              rest = text[start + len(header) :]
              nl = rest.find("\n")
              body = rest[nl + 1 :] if nl >= 0 else rest
              end = body.find("\n## [")
              section = body if end < 0 else body[:end]
              changelog = section.strip() + "\n"

          notes = f"""{changelog}
          ## Binaries

          Supported Python versions for the CLI are **CPython 3.12** and **CPython 3.14**. The CLI does not ship Python. Download the archive that matches the version you have (`py3.14` if you have both, or if you are installing Python for Oneil). Homebrew, python.org, a distro package, and uv all work.

          - Linux: `oneil-v{version}-x86_64-unknown-linux-gnu-py3.12.tar.gz`, `…-py3.14.tar.gz`
          - Windows: `oneil-v{version}-x86_64-pc-windows-msvc-py3.12.zip`, `…-py3.14.zip`
          - Apple Silicon macOS: `oneil-v{version}-aarch64-apple-darwin-py3.12.tar.gz`, `…-py3.14.tar.gz`

          Or run the attached installer. It uses Python 3.14 when that is installed, otherwise 3.12, and downloads that archive:

          ```sh
          curl -fsSL https://github.com/careweather/oneil/releases/download/v{version}/install-oneil.sh | bash
          ```

          See the [installation guide](https://careweather.github.io/oneil/02-installation.html).

          ## Python library

          Wheels for the Python library (`pip install` / `import oneil`) are
          attached. Appendix A covers `import oneil` from a standalone interpreter.
          """
          # Dedent the f-string block above (leading spaces from YAML heredoc style).
          import textwrap

          out_path.write_text(textwrap.dedent(notes).strip() + "\n", encoding="utf-8")
          print(f"Wrote release notes ({out_path.stat().st_size} bytes)")
          PY
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # `v1.0.0-beta.4` contains `-` after the core version; keep those off
          # `/releases/latest` so the extension and install-oneil do not treat
          # a beta as the stable latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
