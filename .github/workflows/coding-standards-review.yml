# Advisory Cursor review of PR diffs against docs/CODING_STANDARDS.md.
# Posts (or updates) a sticky PR comment. Does not fail on style findings.
# Infra failures (missing key, agent crash) fail the job.

name: Coding Standards Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src-rs/**"

concurrency:
  group: coding-standards-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OUTPUT_PATH: ${{ github.workspace }}/coding-standards-review.md
  COMMENT_MARKER: "<!-- coding-standards-review -->"
  PROMPT_PATH: .github/coding-standards-review/prompt.md
  REVIEW_MODEL: composer-2.5

jobs:
  review:
    # Skip PRs opened by weekly-quality-review.yml: those are themselves
    # agent-generated, so having this agent review them again is redundant.
    if: ${{ !startsWith(github.head_ref, 'weekly-quality/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch PR base
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Determine reviewable changes
        id: diff
        run: |
          set -euo pipefail
          RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-status "$RANGE" -- src-rs || true)"
          COUNT="$(printf '%s\n' "$CHANGED_FILES" | grep -c . || true)"

          echo "Reviewable changes in $RANGE: $COUNT file(s)"

          {
            echo "range=$RANGE"
            echo "count=$COUNT"
            echo "changed_files<<CHANGED_FILES_EOF"
            echo "$CHANGED_FILES"
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cursor CLI
        if: steps.diff.outputs.count != '0'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # This is a read-only review (see prompt.md #7): the agent needs `git
      # diff`/`git show`/etc. to compute the diff itself, but has no
      # legitimate reason to mutate the repo or touch GitHub -- posting the
      # PR comment is deliberately left to the separate post-review job
      # below. `deny` takes precedence over `allow` *and* is honored even
      # with `--force`/`--yolo`, so this is a real block, not just a prompt
      # request. Note deny entries can't be scoped by allowing a narrower
      # pattern back (deny always wins), so read-only git subcommands are
      # permitted simply by omitting them here and relying on --force to
      # auto-allow anything not explicitly denied. This job never sets
      # GH_TOKEN/GITHUB_TOKEN, so `gh` would already fail to authenticate,
      # but it's denied here too for defense-in-depth.
      # See https://cursor.com/docs/cli/reference/permissions.
      - name: Deny mutating git/gh commands for the agent
        if: steps.diff.outputs.count != '0'
        run: |
          mkdir -p "$HOME/.cursor"
          cat > "$HOME/.cursor/cli-config.json" <<'EOF'
          {
            "version": 1,
            "permissions": {
              "deny": [
                "Shell(gh)",
                "Shell(git:push*)",
                "Shell(git:commit*)",
                "Shell(git:add*)",
                "Shell(git:rm*)",
                "Shell(git:mv*)",
                "Shell(git:checkout*)",
                "Shell(git:switch*)",
                "Shell(git:branch*)",
                "Shell(git:merge*)",
                "Shell(git:rebase*)",
                "Shell(git:reset*)",
                "Shell(git:clean*)",
                "Shell(git:stash*)",
                "Shell(git:cherry-pick*)",
                "Shell(git:revert*)",
                "Shell(git:tag*)",
                "Shell(git:remote*)",
                "Shell(git:config*)",
                "Shell(git:apply*)",
                "Shell(git:am*)",
                "Shell(git:fetch*)",
                "Shell(git:pull*)",
                "Shell(git:submodule*)",
                "Shell(git:worktree*)",
                "Shell(git:init*)",
                "Shell(git:gc*)",
                "Write(**)"
              ]
            }
          }
          EOF

      - name: Run Cursor coding-standards review
        if: steps.diff.outputs.count != '0'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RANGE: ${{ steps.diff.outputs.range }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
        run: |
          set -euo pipefail

          PROMPT="Read \`${PROMPT_PATH}\` for full instructions and follow them exactly.

          Base SHA: ${BASE_SHA}
          Head SHA: ${HEAD_SHA}
          Diff range: ${RANGE}

          Changed files (reviewable):
          \`\`\`
          ${CHANGED_FILES}
          \`\`\`"

          set +e
          RESULT_JSON="$(cursor-agent -p --force --trust --output-format json --model "${REVIEW_MODEL}" "${PROMPT}")"
          STATUS=$?
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo "cursor-agent exited with status ${STATUS}" >&2
            exit 1
          fi

          REVIEW_BODY="$(echo "${RESULT_JSON}" | jq -r '.result // empty')"
          if [ -z "${REVIEW_BODY}" ]; then
            echo "Agent finished with empty result; refusing blank review" >&2
            exit 1
          fi

          {
            echo "${COMMENT_MARKER}"
            echo "## Coding standards review"
            echo
            echo "${REVIEW_BODY}"
          } > "${OUTPUT_PATH}"

          echo "Wrote review to ${OUTPUT_PATH}"

      - name: Write skip notice
        if: steps.diff.outputs.count == '0'
        run: |
          echo "No reviewable changes; skipping agent"
          {
            echo "${COMMENT_MARKER}"
            echo "## Coding standards review"
            echo
            echo "### Summary"
            echo
            # shellcheck disable=SC2016 # backticks below are intentionally literal markdown
            echo 'No reviewable changes in this PR (nothing under `src-rs/`). Agent review skipped.'
            echo
            echo "### Findings"
            echo
            echo "No issues found."
          } > "${OUTPUT_PATH}"

      - name: Upload review artifact
        if: hashFiles(env.OUTPUT_PATH) != ''
        uses: actions/upload-artifact@v4
        with:
          name: coding-standards-review-${{ github.event.pull_request.number }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: ignore

  # A separate job to upsert the sticky PR comment. This is done so that the
  # call to Cursor can't write to the pull request. This is because the call to
  # Cursor contains untrusted input (the code to be reviewed), and we don't want
  # to risk prompt engineering.
  #
  # The review is passed between the jobs via an artifact.
  post-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    needs: review
    steps:
      - name: Download review artifact
        uses: actions/download-artifact@v4
        with:
          name: coding-standards-review-${{ github.event.pull_request.number }}

      - name: Upsert sticky PR comment
        if: hashFiles(env.OUTPUT_PATH) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          ls -la "${{ env.OUTPUT_PATH }}"

          COMMENT_ID=$(
            gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" \
              | head -n 1
          )

          if [ -n "${COMMENT_ID}" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -F body=@"${{ env.OUTPUT_PATH }}"
            echo "Updated comment ${COMMENT_ID}"
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -F body=@"${{ env.OUTPUT_PATH }}"
            echo "Created new coding-standards review comment"
          fi
